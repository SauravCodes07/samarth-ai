services:
  # FastAPI Backend Service
  - type: web
    name: sih-rural-advisory-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Connect to Supabase PostgreSQL or Render PostgreSQL
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://sih-rural-advisory.vercel.app
